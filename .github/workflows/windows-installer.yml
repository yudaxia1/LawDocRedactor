name: build-windows-installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install npm deps
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npm ci

      - name: build renderer
        run: npm run build:renderer

      - name: build pdf worker exe
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/python/requirements.txt
          pip install pyinstaller
          pyinstaller --onefile worker/python/pdf_worker.py --name pdf_worker --distpath worker/bin --workpath .pyi-build --specpath .pyi-spec

      - name: build installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: LawDocRedactor-windows-installer
          path: release/*.exe

